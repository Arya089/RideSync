server:
  port: 8080

spring:
  application:
    name: ridesync

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/ridesync}
    username: ${DB_USER:ridesync}
    password: ${DB_PASSWORD:ridesync123}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ridesync-app
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ridesync.*"

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-string-at-least-32-bytes-long}
    access-token-expiry-ms: 86400000
    refresh-token-expiry-ms: 604800000
  payment:
    mock: ${PAYMENT_MOCK:true}
    key-id: ${RAZORPAY_KEY_ID:rzp_test_mock}
    key-secret: ${RAZORPAY_KEY_SECRET:mock_secret}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:mock_webhook_secret}
  booking:
    pending-expiry-minutes: ${BOOKING_EXPIRY_MINUTES:15}

logging:
  level:
    com.ridesync: DEBUG
    org.hibernate.SQL: INFO