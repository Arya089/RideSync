name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: ridesync
          POSTGRES_USER: ridesync
          POSTGRES_PASSWORD: ridesync123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ridesync -d ridesync"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DB_URL: jdbc:postgresql://localhost:5432/ridesync
      DB_USER: ridesync
      DB_PASSWORD: ridesync123

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Build Docker image
        run: docker build -t ridesync .